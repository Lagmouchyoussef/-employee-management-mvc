<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d"><title id="t">Step 3: install the four Entity Framework Core packages</title><desc id="d">Annotated NuGet package manager with the EF Core packages listed and the Install button highlighted.</desc><rect width="1200" height="540" rx="18" fill="#f3f2f1"/><rect x="30" y="25" width="1140" height="490" rx="12" fill="white" stroke="#ccc"/><rect x="30" y="25" width="1140" height="52" rx="12" fill="#5c2d91"/><text x="58" y="59" fill="white" font-family="Arial" font-size="21" font-weight="bold">Manage NuGet Packages</text><rect x="66" y="100" width="740" height="42" rx="4" fill="white" stroke="#888"/><text x="84" y="127" fill="#444" font-family="Arial" font-size="15">Microsoft.EntityFrameworkCore</text><text x="836" y="127" fill="#333" font-family="Arial" font-size="14">Version: 11.0.0</text><rect x="64" y="94" width="1110" height="58" rx="7" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="70" cy="100" r="18" fill="#d92d20"/><text x="64" y="106" fill="white" font-family="Arial" font-size="15" font-weight="bold">1</text><rect x="66" y="166" width="740" height="42" rx="4" fill="white" stroke="#888"/><text x="84" y="193" fill="#444" font-family="Arial" font-size="15">Microsoft.EntityFrameworkCore.SqlServer</text><text x="836" y="193" fill="#333" font-family="Arial" font-size="14">Version: 11.0.0</text><rect x="66" y="222" width="740" height="42" rx="4" fill="white" stroke="#888"/><text x="84" y="249" fill="#444" font-family="Arial" font-size="15">Microsoft.EntityFrameworkCore.Design</text><text x="836" y="249" fill="#333" font-family="Arial" font-size="14">Version: 11.0.0</text><rect x="66" y="278" width="740" height="42" rx="4" fill="white" stroke="#888"/><text x="84" y="305" fill="#444" font-family="Arial" font-size="15">Microsoft.EntityFrameworkCore.Tools</text><text x="836" y="305" fill="#333" font-family="Arial" font-size="14">Version: 11.0.0</text><rect x="64" y="158" width="1110" height="170" rx="7" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="70" cy="164" r="18" fill="#d92d20"/><text x="64" y="170" fill="white" font-family="Arial" font-size="15" font-weight="bold">2</text><rect x="1010" y="365" width="130" height="46" rx="5" fill="#5c2d91"/><text x="1036" y="394" fill="white" font-family="Arial" font-size="15" font-weight="bold">Install</text><rect x="1002" y="357" width="146" height="62" rx="8" fill="none" stroke="#d92d20" stroke-width="5"/><circle cx="1008" cy="362" r="19" fill="#d92d20"/><text x="1002" y="369" fill="white" font-family="Arial" font-size="16" font-weight="bold">3</text><text x="70" y="371" fill="#4a2a70" font-family="Arial" font-size="15" font-weight="bold">Repeat: search each package, keep the same version, and click Install.</text><text x="70" y="400" fill="#555" font-family="Arial" font-size="14">Install all four: EntityFrameworkCore, SqlServer, Design, and Tools.</text><text x="70" y="468" fill="#777" font-family="Arial" font-size="13">Illustrative screen · Button positions can differ slightly across Visual Studio versions.</text></svg>