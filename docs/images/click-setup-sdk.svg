<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Visual Studio Installer: verify the .NET SDK</title><desc id="d">Annotated Visual Studio Installer with Individual components selected, search for the .NET 11 SDK, and Modify highlighted.</desc><rect width="1200" height="500" rx="18" fill="#f3f2f1"/><rect x="30" y="25" width="1140" height="450" rx="12" fill="white" stroke="#ccc"/><rect x="30" y="25" width="1140" height="52" rx="12" fill="#5c2d91"/><text x="58" y="59" fill="white" font-family="Arial" font-size="21" font-weight="bold">Visual Studio Installer — Individual components</text><rect x="70" y="98" width="190" height="42" rx="5" fill="#fff" stroke="#aaa"/><text x="92" y="125" fill="#444" font-family="Arial" font-size="14">Workloads</text><rect x="272" y="98" width="230" height="42" rx="5" fill="#5c2d91"/><text x="293" y="125" fill="white" font-family="Arial" font-size="14" font-weight="bold">Individual components</text><rect x="264" y="90" width="246" height="58" rx="8" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="270" cy="96" r="18" fill="#d92d20"/><text x="264" y="102" fill="white" font-family="Arial" font-size="15" font-weight="bold">1</text><rect x="70" y="166" width="760" height="40" rx="4" fill="white" stroke="#888"/><text x="90" y="192" fill="#555" font-family="Arial" font-size="14">Search components: .NET 11 SDK</text><rect x="62" y="158" width="776" height="56" rx="8" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="68" cy="164" r="18" fill="#d92d20"/><text x="62" y="170" fill="white" font-family="Arial" font-size="15" font-weight="bold">2</text><rect x="70" y="236" width="760" height="58" rx="6" fill="#faf8fc" stroke="#d5d3d1"/><rect x="92" y="254" width="20" height="20" rx="3" fill="#5c2d91"/><path d="M96 264l5 5 8-11" fill="none" stroke="white" stroke-width="2.5"/><text x="128" y="270" fill="#333" font-family="Arial" font-size="15" font-weight="bold">.NET 11.0 SDK</text><text x="350" y="270" fill="#555" font-family="Arial" font-size="13">Confirm selected / installed</text><rect x="62" y="228" width="776" height="74" rx="9" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="68" cy="234" r="18" fill="#d92d20"/><text x="62" y="240" fill="white" font-family="Arial" font-size="15" font-weight="bold">3</text><rect x="1024" y="402" width="126" height="46" rx="5" fill="#5c2d91"/><text x="1045" y="431" fill="white" font-family="Arial" font-size="15" font-weight="bold">Modify</text><rect x="1016" y="394" width="142" height="62" rx="9" fill="none" stroke="#d92d20" stroke-width="5"/><circle cx="1022" cy="400" r="19" fill="#d92d20"/><text x="1016" y="407" fill="white" font-family="Arial" font-size="16" font-weight="bold">4</text><text x="870" y="178" fill="#4a2a70" font-family="Arial" font-size="14" font-weight="bold">If this component is unavailable, install the SDK using the official .NET download.</text><text x="70" y="360" fill="#555" font-family="Arial" font-size="14">Wait for installation to finish, then reopen Visual Studio.</text></svg>