<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Step 5: run the database migration commands</title><desc id="d">Annotated Package Manager Console. The web project selector, Add-Migration command, Update-Database command, and Enter action are highlighted.</desc><rect width="1200" height="500" rx="18" fill="#f3f2f1"/><rect x="30" y="25" width="1140" height="450" rx="12" fill="white" stroke="#ccc"/><rect x="30" y="25" width="1140" height="52" rx="12" fill="#5c2d91"/><text x="58" y="59" fill="white" font-family="Arial" font-size="21" font-weight="bold">Package Manager Console</text><text x="70" y="115" fill="#333" font-family="Arial" font-size="14" font-weight="bold">Default project</text><rect x="220" y="88" width="500" height="40" rx="4" fill="white" stroke="#888"/><text x="240" y="114" fill="#222" font-family="Arial" font-size="14">Your MVC web project</text><rect x="212" y="80" width="516" height="56" rx="8" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="218" cy="86" r="18" fill="#d92d20"/><text x="212" y="92" fill="white" font-family="Arial" font-size="15" font-weight="bold">1</text><rect x="70" y="160" width="1060" height="220" rx="5" fill="#1e1e1e"/><text x="100" y="207" fill="#d4d4d4" font-family="Consolas,monospace" font-size="18">PM&gt; Add-Migration InitialCreate</text><rect x="90" y="179" width="510" height="42" rx="5" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="96" cy="185" r="18" fill="#d92d20"/><text x="90" y="191" fill="white" font-family="Arial" font-size="15" font-weight="bold">2</text><text x="100" y="251" fill="#6a9955" font-family="Consolas,monospace" font-size="15">Build succeeded. Migration created.</text><text x="100" y="300" fill="#d4d4d4" font-family="Consolas,monospace" font-size="18">PM&gt; Update-Database</text><rect x="90" y="271" width="420" height="42" rx="5" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="96" cy="277" r="18" fill="#d92d20"/><text x="90" y="283" fill="white" font-family="Arial" font-size="15" font-weight="bold">3</text><text x="100" y="343" fill="#6a9955" font-family="Consolas,monospace" font-size="15">Applying migration... Done.</text><rect x="70" y="398" width="1060" height="46" rx="6" fill="#fff4ed" stroke="#d92d20" stroke-width="3"/><text x="92" y="427" fill="#912018" font-family="Arial" font-size="15" font-weight="bold">4  Press Enter after each command and wait for “Done” before continuing.</text></svg>