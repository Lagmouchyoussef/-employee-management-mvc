<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Use the Visual Studio Package Manager Console</title><desc id="d">Annotated Visual Studio console instructions: open Package Manager Console, choose the web project as Default project, and run Install-Package commands.</desc><rect width="1200" height="500" rx="18" fill="#f3f2f1"/><rect x="30" y="25" width="1140" height="450" rx="12" fill="white" stroke="#ccc"/><rect x="30" y="25" width="1140" height="52" rx="12" fill="#5c2d91"/><text x="58" y="59" fill="white" font-family="Arial" font-size="21" font-weight="bold">Visual Studio — Package Manager Console</text><text x="70" y="118" fill="#333" font-family="Arial" font-size="14" font-weight="bold">Open from menu:</text><text x="230" y="118" fill="#222" font-family="Arial" font-size="15">Tools → NuGet Package Manager → Package Manager Console</text><rect x="62" y="90" width="1076" height="46" rx="7" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="68" cy="96" r="18" fill="#d92d20"/><text x="62" y="102" fill="white" font-family="Arial" font-size="15" font-weight="bold">1</text><text x="70" y="173" fill="#333" font-family="Arial" font-size="14" font-weight="bold">Default project</text><rect x="220" y="146" width="560" height="40" rx="4" fill="white" stroke="#888"/><text x="240" y="172" fill="#222" font-family="Arial" font-size="14">WebApplicationMVCCoreEmsi (your MVC project)</text><rect x="212" y="138" width="576" height="56" rx="8" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="218" cy="144" r="18" fill="#d92d20"/><text x="212" y="150" fill="white" font-family="Arial" font-size="15" font-weight="bold">2</text><rect x="70" y="216" width="1060" height="175" rx="5" fill="#1e1e1e"/><text x="96" y="252" fill="#d4d4d4" font-family="Consolas,monospace" font-size="14">PM&gt; Install-Package Microsoft.EntityFrameworkCore -Version 11.0.0</text><text x="96" y="283" fill="#d4d4d4" font-family="Consolas,monospace" font-size="14">PM&gt; Install-Package Microsoft.EntityFrameworkCore.SqlServer -Version 11.0.0</text><text x="96" y="314" fill="#d4d4d4" font-family="Consolas,monospace" font-size="14">PM&gt; Install-Package Microsoft.EntityFrameworkCore.Design -Version 11.0.0</text><text x="96" y="345" fill="#d4d4d4" font-family="Consolas,monospace" font-size="14">PM&gt; Install-Package Microsoft.EntityFrameworkCore.Tools -Version 11.0.0</text><rect x="82" y="229" width="1018" height="136" rx="6" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="88" cy="235" r="18" fill="#d92d20"/><text x="82" y="241" fill="white" font-family="Arial" font-size="15" font-weight="bold">3</text><text x="70" y="431" fill="#4a2a70" font-family="Arial" font-size="14" font-weight="bold">Run one command at a time; wait for each install to complete before entering the next.</text></svg>