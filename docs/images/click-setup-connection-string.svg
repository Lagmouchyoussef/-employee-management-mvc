<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d"><title id="t">Edit the SQL Server connection string in Visual Studio</title><desc id="d">Annotated Visual Studio editor and Solution Explorer. Red frames identify appsettings.json, the connection string, and the save action.</desc><rect width="1200" height="480" rx="18" fill="#f3f2f1"/><rect x="30" y="25" width="1140" height="430" rx="12" fill="white" stroke="#ccc"/><rect x="30" y="25" width="1140" height="52" rx="12" fill="#5c2d91"/><text x="58" y="59" fill="white" font-family="Arial" font-size="21" font-weight="bold">Visual Studio — edit appsettings.json</text><rect x="60" y="96" width="285" height="280" rx="5" fill="#faf9f8" stroke="#ddd"/><text x="82" y="132" fill="#333" font-family="Arial" font-size="15" font-weight="bold">Solution Explorer</text><text x="84" y="172" fill="#444" font-family="Arial" font-size="14">▾ WebApplicationMVCCoreEmsi</text><text x="110" y="207" fill="#444" font-family="Arial" font-size="14">▸ Controllers</text><text x="110" y="237" fill="#444" font-family="Arial" font-size="14">▸ Models</text><text x="110" y="267" fill="#444" font-family="Arial" font-size="14">▾ appsettings.json</text><rect x="100" y="246" width="220" height="35" rx="5" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="106" cy="251" r="17" fill="#d92d20"/><text x="100" y="257" fill="white" font-family="Arial" font-size="14" font-weight="bold">1</text><rect x="380" y="96" width="760" height="280" rx="5" fill="#1e1e1e"/><text x="410" y="138" fill="#d4d4d4" font-family="Consolas,monospace" font-size="15">"ConnectionStrings": {</text><text x="440" y="174" fill="#d4d4d4" font-family="Consolas,monospace" font-size="15">"DefaultConnection":</text><text x="470" y="210" fill="#ce9178" font-family="Consolas,monospace" font-size="15">"Server=.;Initial Catalog=MVCCore;Integrated Security=True;Encrypt=False;TrustServerCertificate=True"</text><text x="410" y="246" fill="#d4d4d4" font-family="Consolas,monospace" font-size="15">}</text><rect x="430" y="152" width="690" height="68" rx="5" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="436" cy="158" r="17" fill="#d92d20"/><text x="430" y="164" fill="white" font-family="Arial" font-size="14" font-weight="bold">2</text><rect x="920" y="290" width="190" height="44" rx="5" fill="#5c2d91"/><text x="950" y="318" fill="white" font-family="Arial" font-size="15" font-weight="bold">Save (Ctrl+S)</text><rect x="912" y="282" width="206" height="60" rx="9" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="918" cy="288" r="18" fill="#d92d20"/><text x="912" y="294" fill="white" font-family="Arial" font-size="15" font-weight="bold">3</text><text x="60" y="417" fill="#4a2a70" font-family="Arial" font-size="14" font-weight="bold">For a new project replace MVCCore with your chosen database name; keep the server name for your SQL instance.</text></svg>