<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Visual Studio scaffold an MVC controller with Entity Framework views</title><desc id="desc">Illustrative scaffolding dialog set to Employee model, EmployeeContext, EmployeesController, and generate CRUD views.</desc>
<rect width="1280" height="720" rx="24" fill="#f3f2f1"/><rect x="28" y="28" width="1224" height="664" rx="14" fill="#fff" stroke="#d5d3d1" stroke-width="2"/><rect x="28" y="28" width="1224" height="58" rx="14" fill="#5c2d91"/><text x="62" y="65" fill="#fff" font-family="Segoe UI,Arial" font-size="22" font-weight="600">Add New Scaffolded Item</text><text x="1210" y="63" fill="#fff" font-family="Arial" font-size="26">×</text>
<text x="68" y="130" fill="#222" font-family="Segoe UI,Arial" font-size="20" font-weight="600">MVC scaffolding</text><text x="68" y="160" fill="#666" font-family="Segoe UI,Arial" font-size="14">Select a template and configure the generated files.</text>
<rect x="68" y="192" width="385" height="344" rx="6" fill="#faf9f8" stroke="#d5d3d1"/><text x="92" y="230" fill="#222" font-family="Segoe UI,Arial" font-size="16" font-weight="600">Available templates</text><rect x="86" y="250" width="350" height="74" rx="5" fill="#f8f6fb" stroke="#5c2d91" stroke-width="2"/><text x="106" y="279" fill="#333" font-family="Segoe UI,Arial" font-size="14" font-weight="600">MVC Controller with views,</text><text x="106" y="301" fill="#333" font-family="Segoe UI,Arial" font-size="14" font-weight="600">using Entity Framework</text><text x="106" y="346" fill="#666" font-family="Segoe UI,Arial" font-size="13">Creates controller actions and Razor views</text><text x="106" y="368" fill="#666" font-family="Segoe UI,Arial" font-size="13">for Create, Edit, Details, Delete, and Index.</text>
<text x="500" y="220" fill="#333" font-family="Segoe UI,Arial" font-size="15" font-weight="600">Model class</text><rect x="690" y="190" width="490" height="44" rx="4" fill="#fff" stroke="#888"/><text x="710" y="218" fill="#222" font-family="Segoe UI,Arial" font-size="15">Employee (EmployeeManagement.Models)</text><text x="1155" y="218" fill="#555" font-family="Arial" font-size="16">▾</text>
<text x="500" y="286" fill="#333" font-family="Segoe UI,Arial" font-size="15" font-weight="600">Data context class</text><rect x="690" y="256" width="490" height="44" rx="4" fill="#fff" stroke="#888"/><text x="710" y="284" fill="#222" font-family="Segoe UI,Arial" font-size="15">EmployeeContext</text><text x="1155" y="284" fill="#555" font-family="Arial" font-size="16">▾</text>
<text x="500" y="352" fill="#333" font-family="Segoe UI,Arial" font-size="15" font-weight="600">Controller name</text><rect x="690" y="322" width="490" height="44" rx="4" fill="#fff" stroke="#888"/><text x="710" y="350" fill="#222" font-family="Segoe UI,Arial" font-size="15">EmployeesController</text>
