<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Step 4: add the scaffolded MVC controller</title><desc id="d">Annotated MVC scaffolding screen with the Entity Framework controller template, Employee model, EmployeeContext, and Add button highlighted.</desc><rect width="1200" height="520" rx="18" fill="#f3f2f1"/><rect x="30" y="25" width="1140" height="470" rx="12" fill="white" stroke="#ccc"/><rect x="30" y="25" width="1140" height="52" rx="12" fill="#5c2d91"/><text x="58" y="59" fill="white" font-family="Arial" font-size="21" font-weight="bold">Add New Scaffolded Item</text><text x="70" y="117" fill="#222" font-family="Arial" font-size="17" font-weight="bold">Select a scaffold template</text><rect x="70" y="138" width="500" height="76" rx="7" fill="#faf8fc" stroke="#d5d3d1"/><text x="92" y="168" fill="#222" font-family="Arial" font-size="15" font-weight="bold">MVC Controller with views, using Entity Framework</text><text x="92" y="194" fill="#555" font-family="Arial" font-size="13">Generates the controller and Create, Edit, Details, Delete, Index views</text><rect x="62" y="130" width="516" height="92" rx="9" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="68" cy="136" r="18" fill="#d92d20"/><text x="62" y="142" fill="white" font-family="Arial" font-size="15" font-weight="bold">1</text><text x="620" y="148" fill="#333" font-family="Arial" font-size="14" font-weight="bold">Model class</text><rect x="760" y="124" width="370" height="40" rx="4" fill="white" stroke="#888"/><text x="778" y="150" fill="#222" font-family="Arial" font-size="14">Employee</text><rect x="752" y="116" width="386" height="56" rx="8" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="758" cy="122" r="18" fill="#d92d20"/><text x="752" y="128" fill="white" font-family="Arial" font-size="15" font-weight="bold">2</text><text x="620" y="214" fill="#333" font-family="Arial" font-size="14" font-weight="bold">Data context class</text><rect x="760" y="190" width="370" height="40" rx="4" fill="white" stroke="#888"/><text x="778" y="216" fill="#222" font-family="Arial" font-size="14">EmployeeContext</text><rect x="752" y="182" width="386" height="56" rx="8" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="758" cy="188" r="18" fill="#d92d20"/><text x="752" y="194" fill="white" font-family="Arial" font-size="15" font-weight="bold">3</text><text x="620" y="280" fill="#333" font-family="Arial" font-size="14" font-weight="bold">Controller name</text><rect x="760" y="256" width="370" height="40" rx="4" fill="white" stroke="#888"/><text x="778" y="282" fill="#222" font-family="Arial" font-size="14">EmployeesController</text><rect x="760" y="318" width="20" height="20" rx="3" fill="#5c2d91"/><path d="M764 328l5 5 8-11" fill="none" stroke="white" stroke-width="2.5"/><text x="792" y="334" fill="#333" font-family="Arial" font-size="14">Generate views</text><rect x="1025" y="420" width="115" height="44" rx="5" fill="#5c2d91"/><text x="1061" y="448" fill="white" font-family="Arial" font-size="15" font-weight="bold">Add</text><rect x="1017" y="412" width="131" height="60" rx="8" fill="none" stroke="#d92d20" stroke-width="5"/><circle cx="1023" cy="417" r="19" fill="#d92d20"/><text x="1017" y="424" fill="white" font-family="Arial" font-size="16" font-weight="bold">4</text><text x="70" y="276" fill="#4a2a70" font-family="Arial" font-size="14" font-weight="bold">Choose the template, model, context, and controller name. Then click Add.</text></svg>