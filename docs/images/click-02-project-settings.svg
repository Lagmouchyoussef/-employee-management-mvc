<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Step 2: configure the project and click Create</title><desc id="d">Annotated Visual Studio project settings. Red frames identify project name, framework, HTTPS, and Create.</desc><rect width="1200" height="500" rx="18" fill="#f3f2f1"/><rect x="30" y="25" width="1140" height="450" rx="12" fill="#fff" stroke="#ccc"/><rect x="30" y="25" width="1140" height="52" rx="12" fill="#5c2d91"/><text x="58" y="59" fill="white" font-family="Arial" font-size="21" font-weight="bold">Configure your new project</text><text x="80" y="122" fill="#333" font-family="Arial" font-size="15" font-weight="bold">Project name</text><rect x="255" y="94" width="640" height="42" rx="4" fill="white" stroke="#888"/><text x="274" y="121" fill="#222" font-family="Arial" font-size="15">EmployeeManagement</text><rect x="247" y="86" width="656" height="58" rx="8" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="254" cy="92" r="18" fill="#d92d20"/><text x="248" y="98" fill="white" font-family="Arial" font-size="15" font-weight="bold">1</text><text x="80" y="194" fill="#333" font-family="Arial" font-size="15" font-weight="bold">Framework</text><rect x="255" y="166" width="640" height="42" rx="4" fill="white" stroke="#888"/><text x="274" y="193" fill="#222" font-family="Arial" font-size="15">.NET 11.0 (choose an installed SDK)</text><rect x="247" y="158" width="656" height="58" rx="8" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="254" cy="164" r="18" fill="#d92d20"/><text x="248" y="170" fill="white" font-family="Arial" font-size="15" font-weight="bold">2</text><rect x="255" y="236" width="20" height="20" rx="3" fill="#5c2d91"/><path d="M259 246l5 5 8-11" fill="none" stroke="white" stroke-width="2.5"/><text x="286" y="252" fill="#333" font-family="Arial" font-size="15">Configure for HTTPS</text><rect x="247" y="228" width="238" height="36" rx="7" fill