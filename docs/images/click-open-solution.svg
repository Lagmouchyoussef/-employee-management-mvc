<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d"><title id="t">Open the existing MVC project in Visual Studio</title><desc id="d">Annotated Visual Studio start window with Open a project or solution and the solution file highlighted.</desc><rect width="1200" height="460" rx="18" fill="#f3f2f1"/><rect x="30" y="25" width="1140" height="410" rx="12" fill="white" stroke="#ccc"/><rect x="30" y="25" width="1140" height="52" rx="12" fill="#5c2d91"/><text x="58" y="59" fill="white" font-family="Arial" font-size="21" font-weight="bold">Visual Studio — Get started</text><text x="70" y="120" fill="#222" font-family="Arial" font-size="19" font-weight="bold">Open or create a project</text><rect x="70" y="145" width="490" height="78" rx="7" fill="#faf8fc" stroke="#d5d3d1"/><text x="98" y="177" fill="#222" font-family="Arial" font-size="16" font-weight="bold">Open a project or solution</text><text x="98" y="201" fill="#555" font-family="Arial" font-size="13">Continue working on an existing MVC application</text><rect x="62" y="137" width="506" height="94" rx="9" fill="none" stroke="#d92d20" stroke-width="4"/><circle cx="68" cy="143" r="18" fill="#d92d20"/><text x="62" y="149" fill="white" font-family="Arial" font-size="15" font-weight="bold">1</text><rect x="70" y="255" width="490" height="64" rx="7" fill="white" stroke="#ddd"/><text x="98" y="294" fill="#444" font-family="Arial" font-size="15">Create a new project (start from scratch)</text><text x="640" y="128" fill="#333" font-family="Arial" font-size="16" font-weight="bold">Browse to the project folder and select:</text><rect x="640" y="154" width="480" height="64" rx="6" fill="#f8f6fb" stroke="#d8c8ed"/><text x="662" y="193" fill="#4a2a70" font-family="Consolas,monospace" font-size="15" font-weight="bold">ASP.NET CORE MVC.slnx</text><rect x="640" y="234" width="480" height="64" rx="6" fill="#f8f6fb" stroke="#d8c8ed"/><text x="662" y="273" fill="#4a2a70"